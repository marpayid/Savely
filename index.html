            event.preventDefault();
            console.warn('[Storage/IDB] Handled closing database transaction:', msg);
          }
        }
      });

        if (event && event.message) {
          var msg = String(event.message || '');

            event.preventDefault();
            console.warn('[Storage/IDB] Handled database error:', msg);
          }
        }
      }, true);
